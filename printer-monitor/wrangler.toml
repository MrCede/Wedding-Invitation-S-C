name = "printer-monitor"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Dominio propio: Cloudflare crea el DNS y el certificado de printer.dcmdevelop.com.
# Requiere que la zona dcmdevelop.com esté en tu cuenta de Cloudflare.
routes = [
  { pattern = "printer.dcmdevelop.com", custom_domain = true }
]

# Archivos estáticos (web). Solo /api/* pasa primero por el Worker.
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

# Estado del monitor (último ping, historial). Un único objeto "main".
[[durable_objects.bindings]]
name = "HUB"
class_name = "StatusHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatusHub"]

# Secreto requerido (no va en este archivo):
#   npx wrangler secret put AGENT_TOKEN

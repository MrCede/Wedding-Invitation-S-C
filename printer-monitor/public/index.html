<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <title>Monitor de red</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236b7592' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-alert="none">
  <div class="vignette" aria-hidden="true"></div>

  <div id="banner" class="banner" role="alert" hidden>
    <span class="banner-icon" aria-hidden="true">⚠</span>
    <span id="bannerText" class="banner-text"></span>
    <button id="silence" class="btn btn-ghost" type="button">Silenciar</button>
  </div>

  <main class="wrap">
    <header class="top">
      <div>
        <h1>Monitor de red</h1>
        <p class="sub">Ping a tu Wi-Fi en tiempo real</p>
      </div>
      <div class="top-actions">
        <span id="agent" class="pill" data-state="unknown">
          <i class="dot" aria-hidden="true"></i><span id="agentText">Conectando…</span>
        </span>
        <button id="enable" class="btn" type="button">🔔 Activar alertas</button>
      </div>
    </header>

    <section id="grid" class="grid" aria-live="polite"></section>

    <p id="empty" class="empty" hidden>
      Aún no hay datos. Inicia el agente dentro de tu red Wi-Fi
      (<code>agent/ping_agent.py</code>) y aparecerán aquí.
    </p>

    <p class="foot">Se actualiza cada 3 s · <span id="clock"></span></p>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="card-tpl">
    <article class="card" data-state="unknown">
      <div class="heart-wrap">
        <span class="ring"></span><span class="ring ring-2"></span>
        <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h2 class="ip"></h2>
      <p class="name"></p>
      <p class="status"></p>
      <p class="detail"></p>
      <div class="strip" aria-label="Últimas comprobaciones"></div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
